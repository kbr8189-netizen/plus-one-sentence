<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>질문 한 번 더하기 진행자 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* Layout: 매장 판매 현장의 메모 카드. 상단 브랜드 바 + 3개 탭(만들기 · 모아보기 · 내일 해봄), 카드 그리드 보드 */
:root{
  --bg:#FFFFFF;
  --surface:#F3F2F0;
  --surface-2:#E9E7E4;
  --line:#DEDCD8;
  --ink:#2B2B2D;
  --ink-2:#4A4A4F;
  --muted:#6E6E73;
  --accent:#D6001C;
  --accent-ink:#FBFAF8;
  --accent-soft:#FBE7E9;
  --bar:#2B2B2D;
  --bar-ink:#FBFAF8;
  --ok:#1F7A4D;
  --font-body:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
  --font-display:'Noto Serif KR', 'AppleMyungjo', Georgia, serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1C1E; --surface:#2A2A2D; --surface-2:#333337; --line:#3E3E43;
    --ink:#F2F1EF; --ink-2:#CFCFCF; --muted:#A3A3A8; --accent:#FF4D5E; --accent-ink:#1C1C1E;
    --accent-soft:#3A2226; --bar:#111113; --bar-ink:#F2F1EF; --ok:#5CC48F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1C1E; --surface:#2A2A2D; --surface-2:#333337; --line:#3E3E43;
  --ink:#F2F1EF; --ink-2:#CFCFCF; --muted:#A3A3A8; --accent:#FF4D5E; --accent-ink:#1C1C1E;
  --accent-soft:#3A2226; --bar:#111113; --bar-ink:#F2F1EF; --ok:#5CC48F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
header.top{background:var(--bar);color:var(--bar-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:28px;height:6px;background:var(--accent);border-radius:2px;flex:none}
.brand p{margin:0;font-size:13px;letter-spacing:.06em;opacity:.85}
.stats{display:flex;gap:16px;font-size:13px;font-variant-numeric:tabular-nums;opacity:.9}
.stats b{font-size:16px}
.hero{padding-block:28px 8px}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.2;margin:0 0 8px;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;color:var(--ink-2);max-width:62ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:20px}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:16px;padding:14px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav.tabs .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--ink);font-size:12px;margin-right:6px}
nav.tabs button[aria-selected="true"] .num{background:var(--accent);color:var(--accent-ink)}
main{padding-block:24px 64px}
section.panel[hidden]{display:none}
.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;align-items:start}
@media (max-width:860px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field:last-child{margin-bottom:0}
label.lbl,.lbl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.02em}
.tag.exp{background:var(--ink);color:var(--bg)}
.tag.eye{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-flex;align-items:center;font-size:17px;font-weight:900;letter-spacing:.01em;padding:9px 20px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.pill.exp{background:var(--ink);color:var(--bg)}
.pill.eye{background:var(--accent);color:var(--accent-ink)}
.help{font-size:13px;color:var(--muted);margin:0}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.eye[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.example{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.example q{font-weight:700;color:var(--ink)}
.linkbtn{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--accent);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.btn{appearance:none;font:inherit;font-weight:700;font-size:16px;border-radius:10px;padding:13px 22px;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--bg);border-color:var(--line);color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg{font-size:14px;font-weight:700;min-height:1.5em;margin:0}
.msg.ok{color:var(--ok)} .msg.err{color:var(--accent)}
.guide h2{font-family:var(--font-display);font-size:22px;margin:0 0 12px}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;color:var(--ink-2)}
.guide ol b{color:var(--ink)}
.compare{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.compare .before{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.compare .after{font-weight:700}
.compare .after em{font-style:normal;color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.entry .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.entry .meta b{color:var(--ink);font-size:15px}
.entry .base{font-size:15px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px}
.entry .line{display:flex;flex-direction:column;gap:4px}
.entry .line p{margin:0;font-size:17px;font-weight:700;line-height:1.5;overflow-wrap:anywhere}
.entry .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:36px 24px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--font-display);margin:0 0 6px;color:var(--ink);font-size:20px}
.pledges{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:20px}
.pledge{background:var(--surface);border-left:5px solid var(--accent);border-radius:10px;padding:16px 18px;min-width:0}
.pledge p{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.5;overflow-wrap:anywhere}
.pledge small{display:block;margin-top:8px;color:var(--muted);font-size:13px}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:16px}
footer.admin{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:13px}
footer.admin .row{justify-content:space-between}
@media (prefers-reduced-motion:no-preference){.entry,.pledge{animation:rise .35s ease both}@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
.login{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--font-display);font-size:24px;margin:0}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
#loginView[hidden],#app[hidden]{display:none}
</style>
</head>
<body>
<main class="wrap" id="loginView" hidden>
  <form class="card login" id="loginForm" novalidate>
    <h1>진행자 보드 로그인</h1>
    <p class="help">강사 비밀번호를 입력하면 실시간 보드가 열립니다.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">
    <div class="row">
      <button class="btn primary" type="submit" id="loginBtn">로그인</button>
      <p class="msg" id="loginMsg" role="status"></p>
    </div>
  </form>
</main>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="mark"></span><p>신세계백화점 판매역량 향상 교육 · 진행자 보드</p></div>
    <div class="stats" aria-live="polite"><span>제출 <b id="statEntries">0</b></span><span>내일 해봄 <b id="statPledges">0</b></span></div>
  </div>
</header>

<div class="wrap hero">
  <h1>매출 향상을 위한,<br><span>질문 한 번 더하기</span></h1>
  <p>진행자 화면입니다. 참가자가 휴대폰(<b id="joinUrl"></b>)으로 올린 한 문장과 내일 해봄 약속이 몇 초마다 자동으로 모입니다.</p>
</div>

<nav class="tabs" aria-label="실습 단계">
  <div class="wrap" role="tablist">
    <button role="tab" id="tab-board" aria-controls="panel-board" aria-selected="true"><span class="num">1</span>모아보기</button>
    <button role="tab" id="tab-pledge" aria-controls="panel-pledge" aria-selected="false"><span class="num">2</span>내일 해봄</button>
  </div>
</nav>

<main class="wrap">
  <div class="notice" id="offline" hidden>서버에 연결되지 않아 새 제출을 불러오지 못하고 있습니다. 인터넷 연결을 확인해 주세요. 연결되면 자동으로 다시 불러옵니다.</div>

  <section class="panel" id="panel-board" role="tabpanel" aria-labelledby="tab-board">
    <div class="toolbar">
      <div class="chips" id="filterChips" role="group" aria-label="매장 필터"></div>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section class="panel" id="panel-pledge" role="tabpanel" aria-labelledby="tab-pledge" hidden>
    <div class="pledges" id="pledges"></div>
  </section>
</main>

<footer class="admin" id="adminBar">
  <div class="wrap row">
    <span>진행자 전용 · 다음 회차 전에 보드를 비웁니다.</span>
    <div class="row">
      <span id="resetConfirmText" hidden>정말 모든 제출과 약속을 지울까요?</span>
      <button class="btn ghost" type="button" id="resetBtn">보드 비우기</button>
      <button class="btn primary" type="button" id="resetYes" hidden>네, 지웁니다</button>
      <button class="btn ghost" type="button" id="resetNo" hidden>취소</button>
      <p class="msg" id="resetMsg" role="status"></p>
    </div>
  </div>
</footer>
</div>

<script>
(function(){
  const STORES = ["패션·잡화","뷰티","식품","식당","기타"];
  const POLL_MS = 4000;
  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  const state = { entries:[], pledges:[], filter:"전체" };

  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    if(attrs) for(const [k,v] of Object.entries(attrs)){
      if(k==="class") n.className=v; else if(k==="text") n.textContent=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v);
    }
    kids.forEach(c=>{ if(c!=null) n.append(c); });
    return n;
  }
  function setMsg(id, text, ok){ const m=$(id); m.textContent=text; m.className="msg "+(ok?"ok":"err"); }

  /* Tabs */
  const tabs = ["board","pledge"];
  function showTab(name){
    tabs.forEach(t=>{ $("tab-"+t).setAttribute("aria-selected", String(t===name)); $("panel-"+t).hidden = t!==name; });
    store.set("hm_tab", name);
  }
  tabs.forEach(t=> $("tab-"+t).addEventListener("click",()=>showTab(t)));
  const hash = (location.hash||"").slice(1);
  showTab(tabs.includes(hash) ? hash : (tabs.includes(store.get("hm_tab")) ? store.get("hm_tab") : "board"));

  /* Board */
  function renderFilter(){
    const box=$("filterChips"); box.replaceChildren();
    ["전체", ...STORES].forEach(s=> box.append(el("button",{class:"chip",type:"button","aria-pressed":String(state.filter===s),text:s,onclick:()=>{ state.filter=s; renderFilter(); renderBoard(); }})));
  }

  function renderBoard(){
    const box=$("board"); box.replaceChildren();
    let list = state.entries.filter(e=> state.filter==="전체" || e.store===state.filter);
    if(!list.length){
      box.append(el("div",{class:"empty"},
        el("h3",{text: state.entries.length ? "이 매장의 제출이 아직 없습니다" : "아직 올라온 한 문장이 없습니다"}),
        el("p",{text:"참가자가 휴대폰에서 “완성 카드 만들기”를 누르면 여기에 카드로 모입니다."})));
      return;
    }
    list.forEach(e=>{
      box.append(el("article",{class:"entry"},
        el("div",{class:"meta"}, el("b",{text:e.team||"익명"}), el("span",{class:"tag",text:e.store||""})),
        el("div",{class:"base",text:"“"+(e.base||"")+"” 뒤에"}),
        e.exp ? el("div",{class:"line"}, el("span",{class:"lbl"}, el("span",{class:"tag exp",text:"경험"+(e.expType?" · "+e.expType:"")})), el("p",{text:"“"+e.exp+"”"})) : null,
        e.eye ? el("div",{class:"line"}, el("span",{class:"lbl"}, el("span",{class:"tag eye",text:"안목"+(e.eyeType?" · "+e.eyeType:"")})), el("p",{text:"“"+e.eye+"”"})) : null
      ));
    });
  }

  function renderPledges(){
    const box=$("pledges"); box.replaceChildren();
    if(!state.pledges.length){
      box.append(el("div",{class:"empty"}, el("h3",{text:"내일의 해봄을 기다리고 있습니다"}), el("p",{text:"참가자가 “약속 카드 만들기”를 누르면 모두의 약속이 이곳에 모입니다."})));
      return;
    }
    state.pledges.forEach(p=> box.append(el("div",{class:"pledge"}, el("p",{text:p.text}), el("small",{text:[p.team,p.store].filter(Boolean).join(" · ")}))));
  }

  function renderStats(){
    $("statEntries").textContent = state.entries.length;
    $("statPledges").textContent = state.pledges.length;
  }

  /* Polling */
  let lastJson = "";
  async function refresh(){
    try{
      const r = await fetch("/api/feed", {cache:"no-store"});
      if(!r.ok) throw new Error();
      const text = await r.text();
      $("offline").hidden = true;
      if(text===lastJson) return;
      lastJson = text;
      const d = JSON.parse(text);
      state.entries=d.entries||[]; state.pledges=d.pledges||[];
      renderBoard(); renderPledges(); renderStats();
    }catch(e){ $("offline").hidden = false; }
  }

  /* Admin reset */
  function confirmMode(on){ $("resetBtn").hidden=on; $("resetYes").hidden=!on; $("resetNo").hidden=!on; $("resetConfirmText").hidden=!on; }
  $("resetBtn").addEventListener("click",()=>{ $("resetMsg").textContent=""; confirmMode(true); });
  $("resetNo").addEventListener("click",()=>confirmMode(false));
  $("resetYes").addEventListener("click", async ()=>{
    confirmMode(false);
    $("resetBtn").disabled = true;
    try{
      const r = await fetch("/api/admin/reset", {method:"POST"});
      if(r.status===401){ location.reload(); return; }
      if(!r.ok) throw new Error();
      state.entries=[]; state.pledges=[]; lastJson="";
      renderBoard(); renderPledges(); renderStats();
      setMsg("resetMsg","보드를 비웠습니다.", true);
    }catch(e){ setMsg("resetMsg","비우지 못했습니다. 다시 시도해 주세요."); }
    finally{ $("resetBtn").disabled = false; }
  });

  /* Login */
  function start(){
    $("loginView").hidden = true; $("app").hidden = false;
    $("joinUrl").textContent = location.host;
    renderFilter(); renderBoard(); renderPledges(); renderStats();
    refresh(); setInterval(()=>{ if(!document.hidden) refresh(); }, POLL_MS);
  }
  $("loginForm").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const password = $("pw").value;
    if(!password) return setMsg("loginMsg","비밀번호를 입력해 주세요.");
    $("loginBtn").disabled = true; setMsg("loginMsg","확인 중…", true);
    try{
      const r = await fetch("/api/admin/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password})});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) return setMsg("loginMsg", d.error || "로그인에 실패했습니다.");
      start();
    }catch(e){ setMsg("loginMsg","연결에 실패했습니다. 다시 시도해 주세요."); }
    finally{ $("loginBtn").disabled = false; }
  });
  fetch("/api/admin/session", {cache:"no-store"}).then(r=>r.json()).then(d=>{
    if(d && d.admin) start(); else { $("loginView").hidden = false; $("pw").focus(); }
  }).catch(()=>{ $("loginView").hidden = false; });
})();
</script>
</body>
</html>
